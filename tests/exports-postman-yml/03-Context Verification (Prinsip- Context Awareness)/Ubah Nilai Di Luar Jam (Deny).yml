info:
  name: Ubah Nilai Di Luar Jam (Deny)
  type: http
  seq: 1

http:
  method: PUT
  url: http://127.0.0.1:3100/nilai/1
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: X-Device-ID
      value: DEV-DOSEN-01
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "angka": 85
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
