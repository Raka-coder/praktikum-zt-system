info:
  name: Akses Langsung dengan Secret Tapi Tanpa Token (Deny)
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:3001/nilai
  headers:
    - name: X-Gateway-Secret
      value: "{{process.env.GATEWAY_SECRET}}"
    - name: X-Device-ID
      value: DEV-MHS-01
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
