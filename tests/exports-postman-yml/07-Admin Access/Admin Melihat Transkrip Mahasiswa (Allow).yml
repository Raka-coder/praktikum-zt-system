info:
  name: Admin Melihat Transkrip Mahasiswa (Allow)
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:3100/transkrip/2024001    # Atur sesuai NIM yg ada
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
    - name: X-Device-ID
      value: DEV-ADMIN-01
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
